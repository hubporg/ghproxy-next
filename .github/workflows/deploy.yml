name: Build and Deploy

# Triggered by pushes to main, and by completion of the node-contribution workflow.
# workflow_run is needed because a push made with GITHUB_TOKEN does not emit a push event.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Validate and Add Acceleration Node"]
    types: [completed]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only deploy after a successful node-contribution run; plain push events are unaffected
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0' # 选择适合的 Node.js 版本
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build
      
      - name: Deploy to EdgeOne Maker
        run: npx edgeone makers deploy ./out -n ghproxy-next -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
